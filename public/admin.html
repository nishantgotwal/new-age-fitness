<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — New Age Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0F0D08;--panel:#1C1810;--ink:#F4EFE3;--ink-soft:#C9C0A8;--gold:#D4AF37;--line:#33301F;--muted:#8A8168;}
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;margin:0;padding:24px;}
  h1{font-family:'Archivo Black';font-size:26px;color:var(--gold);margin-bottom:4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
  .key-box{display:flex;gap:10px;margin-bottom:30px;max-width:420px;}
  input{flex:1;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
  button{padding:10px 18px;border-radius:6px;border:none;background:var(--gold);color:#1A1509;font-weight:700;cursor:pointer;}
  table{width:100%;border-collapse:collapse;margin-bottom:40px;background:var(--panel);border-radius:8px;overflow:hidden;}
  th,td{padding:12px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{color:var(--gold);text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;}
  tr:last-child td{border-bottom:none;}
  .status{padding:4px 10px;border-radius:100px;font-size:12px;font-weight:700;}
  .status.pending_payment{background:rgba(224,101,76,0.15);color:#E0654C;}
  .status.paid{background:rgba(212,175,55,0.15);color:var(--gold);}
  h2{font-size:18px;margin-bottom:14px;color:var(--ink);}
  .empty{color:var(--muted);font-size:14px;padding:14px 0;}
  .scroll{overflow-x:auto;}
</style>
</head>
<body>
  <h1>New Age Fitness — Admin</h1>
  <div class="sub">View membership sign-ups and contact messages submitted through the website.</div>

  <div class="key-box">
    <input type="password" id="keyInput" placeholder="Enter admin key">
    <button id="loadBtn">Load</button>
  </div>

  <h2>Membership Sign-ups</h2>
  <div class="scroll">
    <table id="signupsTable" style="display:none;">
      <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Plan</th><th>Billing</th><th>Status</th><th>Date</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="empty" id="signupsEmpty">Enter the admin key above to load data.</div>

  <h2>Contact Messages</h2>
  <div class="scroll">
    <table id="messagesTable" style="display:none;">
      <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Message</th><th>Date</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="empty" id="messagesEmpty"></div>

<script>
  const params = new URLSearchParams(location.search);
  const prefill = params.get('key');
  if (prefill) document.getElementById('keyInput').value = prefill;

  document.getElementById('loadBtn').addEventListener('click', load);
  if (prefill) load();

  async function load() {
    const key = document.getElementById('keyInput').value;
    if (!key) return;

    const [signupsRes, messagesRes] = await Promise.all([
      fetch('/api/admin/signups?key=' + encodeURIComponent(key)),
      fetch('/api/admin/messages?key=' + encodeURIComponent(key))
    ]);

    if (signupsRes.status === 401) {
      alert('Invalid admin key.');
      return;
    }

    const signups = await signupsRes.json();
    const messages = await messagesRes.json();

    const sTable = document.getElementById('signupsTable');
    const sBody = sTable.querySelector('tbody');
    sBody.innerHTML = '';
    document.getElementById('signupsEmpty').style.display = signups.length ? 'none' : 'block';
    document.getElementById('signupsEmpty').textContent = 'No sign-ups yet.';
    sTable.style.display = signups.length ? 'table' : 'none';
    signups.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td>${esc(s.plan)}</td><td>${esc(s.cycle)}</td><td><span class="status ${s.status}">${esc(s.status)}</span></td><td>${new Date(s.createdAt).toLocaleString()}</td>`;
      sBody.appendChild(tr);
    });

    const mTable = document.getElementById('messagesTable');
    const mBody = mTable.querySelector('tbody');
    mBody.innerHTML = '';
    document.getElementById('messagesEmpty').style.display = messages.length ? 'none' : 'block';
    document.getElementById('messagesEmpty').textContent = 'No messages yet.';
    mTable.style.display = messages.length ? 'table' : 'none';
    messages.forEach(m => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${esc(m.email)}</td><td>${esc(m.message)}</td><td>${new Date(m.createdAt).toLocaleString()}</td>`;
      mBody.appendChild(tr);
    });
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
</script>
</body>
</html>
